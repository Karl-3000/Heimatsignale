name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/out && echo "ok $GITHUB_SHA $(date -u +%FT%TZ)" > /tmp/out/probe.txt
      - name: Ergebnisse veröffentlichen
        if: always()
        run: |
          cd /tmp/out
          git init -q -b ci-results
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "CI-Ergebnisse für $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results
