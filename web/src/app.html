<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f3f5fa" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#060918" media="(prefers-color-scheme: dark)" />
		<meta name="referrer" content="same-origin" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- Wendet das gespeicherte Farbschema vor dem ersten Zeichnen an. Als Datei, weil die CSP Inline-Skripte verbietet. -->
		<script src="%sveltekit.assets%/theme.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="off">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
